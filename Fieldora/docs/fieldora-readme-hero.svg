<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">Fieldora — Grow smarter. Farm better.</title>
  <desc id="desc">A premium dark green AgriTech banner with the Fieldora wordmark, crop field patterns, a sprout emblem and farm-planning data markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10291f"/>
      <stop offset="0.58" stop-color="#183d2d"/>
      <stop offset="1" stop-color="#0b2119"/>
    </linearGradient>
    <linearGradient id="fieldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8eb56b"/>
      <stop offset="1" stop-color="#396c49"/>
    </linearGradient>
    <linearGradient id="fieldB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5bd72"/>
      <stop offset="1" stop-color="#69834c"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0e58c"/>
      <stop offset="1" stop-color="#6bd3a0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#d7ebd8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="rows" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 0V18" stroke="#e8f0c5" stroke-opacity=".27" stroke-width="2"/>
    </pattern>
    <clipPath id="landClip"><path d="M790 96C950 42 1120 62 1388 156V420H760C812 334 816 222 790 96Z"/></clipPath>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1440" height="470" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="470" rx="28" fill="url(#grid)"/>
  <circle cx="1180" cy="120" r="112" fill="#b7d879" opacity=".08" filter="url(#softGlow)"/>
  <circle cx="1190" cy="112" r="55" fill="#d5d98a" opacity=".92"/>
  <circle cx="1190" cy="112" r="76" fill="none" stroke="#d5d98a" stroke-opacity=".28" stroke-width="1.5"/>
  <g opacity=".5" fill="none" stroke="#d9efd4" stroke-width="1">
    <path d="M744 70H1388M744 402H1388" stroke-opacity=".15"/>
    <path d="M790 80V420M1388 80V420" stroke-opacity=".14"/>
  </g>
  <g clip-path="url(#landClip)">
    <path d="M732 154C900 76 1118 98 1452 238L1448 500H694C804 386 848 282 732 154Z" fill="url(#fieldA)"/>
    <path d="M732 154C900 76 1118 98 1452 238L1448 500H694C804 386 848 282 732 154Z" fill="url(#rows)"/>
    <path d="M690 245C906 145 1118 188 1466 332L1450 520H658C796 410 820 336 690 245Z" fill="url(#fieldB)" opacity=".92"/>
    <path d="M690 245C906 145 1118 188 1466 332L1450 520H658C796 410 820 336 690 245Z" fill="url(#rows)" opacity=".72"/>
    <path d="M634 338C832 235 1090 278 1470 424L1464 520H594C732 445 734 396 634 338Z" fill="#315f3c"/>
    <path d="M634 338C832 235 1090 278 1470 424L1464 520H594C732 445 734 396 634 338Z" fill="url(#rows)" opacity=".7"/>
    <g fill="none" stroke="#eef1d3" stroke-width="3" opacity=".38">
      <path d="M838 500C906 372 944 268 932 130"/>
      <path d="M972 500C1042 378 1080 280 1084 174"/>
      <path d="M1106 500C1172 392 1212 310 1236 218"/>
      <path d="M1240 500C1302 410 1342 348 1378 294"/>
    </g>
  </g>
  <g fill="none" stroke="#c2e4a4" stroke-width="1.5" opacity=".72">
    <path d="M890 258V210H958"/><path d="M1094 320V274H1164"/><path d="M1280 365V326H1350"/>
  </g>
  <g fill="#e7f2cf" stroke="#6d9b61" stroke-width="2">
    <circle cx="890" cy="258" r="7"/><circle cx="1094" cy="320" r="7"/><circle cx="1280" cy="365" r="7"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" fill="#e8f0d6" opacity=".9">
    <text x="967" y="214">SOIL PROFILE</text><text x="1174" y="278">SEASON PLAN</text><text x="1358" y="330" text-anchor="end">MARKET VIEW</text>
  </g>
  <g transform="translate(92 88)">
    <rect x="0" y="0" width="10" height="10" rx="5" fill="#b9df82"/>
    <text x="25" y="10" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3.2" fill="#c8e6b4">AGRICULTURE, WITH MORE CLARITY</text>
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-3" fill="#f4f4e9">Fieldora</text>
    <rect x="1" y="137" width="92" height="5" rx="2.5" fill="url(#mint)"/>
    <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#d9e9cd">Grow smarter. <tspan fill="#bce38d">Farm better.</tspan></text>
    <text x="0" y="235" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c0d0c0">A clearer view of crop choices, cultivation costs</text>
    <text x="0" y="263" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c0d0c0">and the decisions behind every growing season.</text>
    <g transform="translate(0 315)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">
      <rect x="0" y="0" width="144" height="34" rx="17" fill="#234c38" stroke="#5d8c5e"/>
      <text x="72" y="22" text-anchor="middle" fill="#d9edc5">CROP PLANNING</text>
      <rect x="157" y="0" width="162" height="34" rx="17" fill="#234c38" stroke="#5d8c5e"/>
      <text x="238" y="22" text-anchor="middle" fill="#d9edc5">COST ESTIMATES</text>
      <rect x="332" y="0" width="178" height="34" rx="17" fill="#234c38" stroke="#5d8c5e"/>
      <text x="421" y="22" text-anchor="middle" fill="#d9edc5">MARKET AWARENESS</text>
    </g>
  </g>
  <path d="M28 438H1412" stroke="#bce38d" stroke-opacity=".5" stroke-width="1"/>
  <text x="92" y="458" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#95b29a">FIELDORA  /  DIGITAL FARMING FOR INDIA</text>
  <text x="1348" y="458" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#95b29a">PLAN · COMPARE · GROW</text>
</svg>
