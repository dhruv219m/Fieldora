<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Fieldora farm-planning workflow</title>
  <desc id="desc">Six connected steps from creating a farm profile to making an informed planning decision.</desc>
  <rect width="1200" height="180" rx="20" fill="#f7f5ec"/>
  <path d="M88 67H1110" stroke="#c6d4b5" stroke-width="3" stroke-dasharray="5 8"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><circle cx="90" cy="67" r="25" fill="#123d2b"/><text x="90" y="72" fill="#fff" font-size="14" font-weight="700">01</text><text x="90" y="120" fill="#202923" font-size="13" font-weight="700">Create profile</text><text x="90" y="141" fill="#687266" font-size="10">Start with your farm</text></g>
    <g><circle cx="294" cy="67" r="25" fill="#2d6443"/><text x="294" y="72" fill="#fff" font-size="14" font-weight="700">02</text><text x="294" y="120" fill="#202923" font-size="13" font-weight="700">Enter details</text><text x="294" y="141" fill="#687266" font-size="10">Soil, water, season</text></g>
    <g><circle cx="498" cy="67" r="25" fill="#56814f"/><text x="498" y="72" fill="#fff" font-size="14" font-weight="700">03</text><text x="498" y="120" fill="#202923" font-size="13" font-weight="700">Explore crops</text><text x="498" y="141" fill="#687266" font-size="10">See scoring reasons</text></g>
    <g><circle cx="702" cy="67" r="25" fill="#8b6849"/><text x="702" y="72" fill="#fff" font-size="14" font-weight="700">04</text><text x="702" y="120" fill="#202923" font-size="13" font-weight="700">Compare estimates</text><text x="702" y="141" fill="#687266" font-size="10">Costs and ranges</text></g>
    <g><circle cx="906" cy="67" r="25" fill="#b08f4b"/><text x="906" y="72" fill="#fff" font-size="14" font-weight="700">05</text><text x="906" y="120" fill="#202923" font-size="13" font-weight="700">Review prices</text><text x="906" y="141" fill="#687266" font-size="10">Illustrative market view</text></g>
    <g><circle cx="1110" cy="67" r="25" fill="#123d2b"/><text x="1110" y="72" fill="#fff" font-size="14" font-weight="700">06</text><text x="1110" y="120" fill="#202923" font-size="13" font-weight="700">Plan with context</text><text x="1110" y="141" fill="#687266" font-size="10">Verify locally</text></g>
  </g>
</svg>
